<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guru's Games</title>
<meta name="description" content="Mobile games for Android by Guru: Marsh Bite and Beam Bugs.">
<style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#14112e;color:#f2f0ff}
main{max-width:720px;margin:0 auto;padding:40px 16px 60px}
h1{margin:0 0 6px;font-size:30px}
.lead{margin:0 0 28px;color:#b9b4e0}
.game{display:flex;gap:18px;align-items:center;background:#211c48;border-radius:18px;padding:18px;margin-bottom:16px}
.game img{width:84px;height:84px;border-radius:20px;flex:none}
.ph{width:84px;height:84px;border-radius:20px;flex:none;background:linear-gradient(135deg,#2f9a5a,#1b5e3a);display:grid;place-items:center;font-size:40px}
.game h2{margin:0 0 4px;font-size:21px}
.game p{margin:0 0 10px;color:#cfcaf2;font-size:15px}
.links a{display:inline-block;margin:0 14px 6px 0;color:#ffc83d;font-weight:600;text-decoration:none}
.links a:hover{text-decoration:underline}
footer{margin-top:30px;color:#8f89c0;font-size:13px}
footer a{color:#b9b4e0}
@media (max-width:420px){.game{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<main>
<h1>Guru's Games</h1>
<p class="lead">Free mobile games for Android.</p>

<section class="game">
 <div class="ph" aria-hidden="true">🐍</div>
 <div>
  <h2>Marsh Bite</h2>
  <p>A snake-vs-worms game for Android.</p>
  <div class="links">
   <a href="https://play.google.com/store/apps/details?id=com.guru.marshbite">Get it on Google Play</a>
   <a href="https://drive.google.com/file/d/1lY6w3cUPHIhJDx6v3273M07c7hq2QtwF/view?usp=drive_link">Privacy Policy</a>
  </div>
 </div>
</section>

<section class="game">
 <img src="beambugs-icon.png" alt="Beam Bugs icon">
 <div>
  <h2>Beam Bugs: Laser Puzzle</h2>
  <p>Bounce lasers off mirrors, zap sneaky bugs and beat giant 3D bosses.</p>
  <div class="links">
   <a href="https://play.google.com/store/apps/details?id=com.guru.beambugs">Get it on Google Play</a>
   <a href="https://drive.google.com/file/d/10dWDQxvg8714zHHYYP9ZvPPCSoj25E7i/view?usp=sharing">Privacy Policy</a>
  </div>
 </div>
</section>

<footer>Contact: <a href="mailto:gurunanku36@gmail.com">gurunanku36@gmail.com</a></footer>
</main>
</body>
</html>
